name: ARIA CI

# Runs on every push to main/develop, every pull request into main,
# and in the merge queue. Branch protection should require the single
# "CI Gate" check, which only passes when every blocking job passed.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    # "edited" re-runs the issue link check when someone adds the link to the description.
    types: [ opened, synchronize, reopened, edited ]
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same branch or PR, but never cancel main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Lint with ruff
        run: ruff check aria/ tests/ examples/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # No "|| fallback" here. If dependencies cannot install, the job must fail
      # instead of silently running against a different environment.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v --tb=short

  demo:
    name: Demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run demo (mock LLM, no API key needed)
        env:
          PYTHONPATH: .
        run: python examples/demo_v11.py

  build:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel, then validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mypy
        run: pip install "mypy>=1.10.0"

      - name: Run mypy
        run: mypy aria/

  issue-link:
    # Enforces the SDLC rule that every pull request is tracked by an issue.
    # On pushes and merge queue runs there is nothing to check, so it passes.
    name: Issue link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a linked issue in the pull request description
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request, nothing to check."
            exit 0
          fi
          case "$PR_AUTHOR" in
            *"[bot]")
              echo "Bot pull request, link check skipped."
              exit 0
              ;;
          esac
          # Ignore HTML comments (the template hint text lives in one), then look for
          # a closing keyword followed by an issue in THIS repository.
          BODY=$(printf '%s' "$PR_BODY" | perl -0pe 's/<!--.*?-->//gs')
          REPO=$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[.]/[.]/g')
          KEYWORD='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|part of)[[:space:]:]+'
          ISSUE="(#|${REPO}#|https://github[.]com/${REPO}/issues/)[0-9]+"
          if printf '%s' "$BODY" | grep -Eiq "${KEYWORD}${ISSUE}"; then
            echo "Linked issue found."
          else
            echo "::error::This pull request must link an issue in this repository. Add 'Closes #N' or 'Refs #N' (outside HTML comments) to the description. See docs/SDLC.md."
            exit 1
          fi

  ci-gate:
    # The one check to require in branch protection or the ruleset.
    # It runs even when an upstream job fails or is skipped, and it fails
    # unless every blocking job finished with "success".
    name: CI Gate
    if: always()
    needs: [lint, test, demo, build, typecheck, issue-link]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -E '"result": "(failure|cancelled|skipped)"' >/dev/null; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
