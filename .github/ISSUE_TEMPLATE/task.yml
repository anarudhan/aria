name: Task
description: A small piece of engineering work, tech debt or a spike
title: "Task: "
type: Task
labels: ["task", "needs-triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed. Link the parent story or epic
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Work to do
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: How will we know it is done
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - priority-p0 (drop everything)
        - priority-p1 (this iteration)
        - priority-p2 (soon)
        - priority-p3 (whenever)
    validations:
      required: true
