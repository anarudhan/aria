name: Bug report
description: Something is broken or behaves differently from what was expected
title: "Bug: "
type: Bug
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: Include the error message or traceback if there is one
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: ARIA version, Python version and operating system
      placeholder: "ARIA 1.3.0, Python 3.12, Ubuntu 24.04"
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria for the fix
      description: Include a test that fails today and passes after the fix
      placeholder: "- [ ] A regression test covers this\n- [ ] ..."
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - priority-p0 (drop everything)
        - priority-p1 (this iteration)
        - priority-p2 (soon)
        - priority-p3 (whenever)
    validations:
      required: true
